id = "xicum.herdr-bridge"
name = "Herdr Bridge"
version = "0.4.0"
min_herdr_version = "0.9.5"
description = "Reach your agents from herdr-mobile and herdr-obsidian: runs the bridge, pairs a phone by QR code"
platforms = ["linux", "macos"]

# Installing or updating the plugin installs the bridge and starts its service. herdr runs nothing on uninstall
# or disable, so the uninstall pane removes it.
[[build]]
command = ["bash", "plugin/install.sh", "--bridge"]

[[panes]]
id = "app"
title = "Install the Linux app"
placement = "popup"
width = "80%"
height = "60%"
command = ["bash", "plugin/install.sh", "--app"]
platforms = ["linux"]

[[panes]]
id = "pair"
title = "Pair phone"
placement = "popup"
width = "80%"
height = "90%"
command = ["bash", "plugin/install.sh", "--phone"]

[[panes]]
id = "status"
title = "Bridge status"
placement = "popup"
width = "90%"
height = "80%"
command = ["bash", "plugin/install.sh", "--status"]


[[panes]]
id = "uninstall"
title = "Uninstall bridge"
placement = "popup"
width = "80%"
height = "60%"
command = ["bash", "plugin/install.sh", "--uninstall"]

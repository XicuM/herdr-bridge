name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# Third-party actions are pinned to a commit: this workflow can publish releases, and a tag can be moved.
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test
        run: cargo test --locked

      - name: Build Bridge
        run: |
          cargo build --release --locked
          cp target/release/herdr-bridge herdr-bridge-linux-${{ matrix.arch }}

      - name: Upload Bridge Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: herdr-bridge-linux-${{ matrix.arch }}
          path: herdr-bridge-linux-${{ matrix.arch }}

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: herdr-bridge-linux-${{ matrix.arch }}
          generate_release_notes: true
